name: sync

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: rules-mirror-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned Mihomo converter
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error \
            -o "$RUNNER_TEMP/mihomo.gz" \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.30/mihomo-linux-amd64-v1-v1.19.30.gz
          gzip -d "$RUNNER_TEMP/mihomo.gz"
          chmod +x "$RUNNER_TEMP/mihomo"
          echo "MIHOMO_BIN=$RUNNER_TEMP/mihomo" >> "$GITHUB_ENV"

      - name: Build and validate all rule artifacts
        run: ./scripts/sync-local.sh

      - name: Commit one validated rule update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- clash mihomo singbox surge
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "sync validated rule artifacts"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
